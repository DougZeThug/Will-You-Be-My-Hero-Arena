<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mark a character sheet</title>
    <style>
      html, body { margin: 0; height: 100%; background: #20252b; color: #e8e8e8; font: 13px/1.4 system-ui, sans-serif; }
      body { display: grid; grid-template-columns: 320px 1fr; }
      aside { padding: 10px; overflow: auto; border-right: 1px solid #3a424b; }
      aside label { display: block; margin: 6px 0 2px; color: #a9b4bf; }
      aside input[type='text'] { width: 100%; box-sizing: border-box; }
      ol { padding-left: 22px; margin: 8px 0; }
      li { cursor: pointer; padding: 1px 0; color: #8d99a5; }
      li.done { color: #cfe8cf; }
      li.current { color: #ffe36e; font-weight: 600; }
      button { margin: 4px 4px 4px 0; }
      textarea { width: 100%; height: 140px; box-sizing: border-box; font: 11px/1.3 ui-monospace, monospace; }
      canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
      #hint { color: #ffe36e; min-height: 3.2em; }
    </style>
  </head>
  <body>
    <aside>
      <strong>Landmark tool</strong>
      <p>
        Click each point in order. Drag a point to adjust it, click a step to return to it. Wheel
        zooms, middle or right drag pans. For the two sleeve outlines click around the shape, then
        press Enter.
      </p>
      <label>Character id</label><input id="id" type="text" value="new-character" />
      <label>Source sheet (repository path, written into the config)</label>
      <input id="source" type="text" placeholder="lab/…/name_source.png" />
      <label>…or open the PNG from disk</label><input id="file" type="file" accept="image/png" />
      <div><button id="load">Load path</button><button id="undo">Back one step</button></div>
      <div id="hint"></div>
      <ol id="steps"></ol>
      <button id="export">Download config JSON</button>
      <textarea id="json" spellcheck="false" placeholder="Config JSON appears here; paste one and press Import to edit it."></textarea>
      <button id="import">Import</button>
    </aside>
    <canvas id="view"></canvas>
    <script type="module" src="./mark.ts"></script>
  </body>
</html>
